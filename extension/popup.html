<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SongChart Setup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121319;
      color: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo-badge {
      background: #ff5500;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-size: 0.75rem;
      color: #8e8f99;
      font-weight: 600;
      text-transform: uppercase;
    }
    input {
      background: #181920;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #ff5500;
    }
    .btn {
      width: 100%;
      background: #ff5500;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #ff6a1a;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.75rem;
      text-align: center;
      min-height: 16px;
    }
    .status-msg.success {
      color: #00e676;
    }
    .status-msg.error {
      color: #ff5555;
    }
    .footer-link {
      margin-top: 12px;
      text-align: center;
      font-size: 0.75rem;
    }
    .footer-link a {
      color: #8e8f99;
      text-decoration: none;
    }
    .footer-link a:hover {
      color: #ff5500;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">♫</div>
    <h2>SongChart Scrobbler</h2>
  </div>

  <form id="settingsForm">
    <div class="form-group">
      <label for="serverUrl">Server URL</label>
      <input type="url" id="serverUrl" placeholder="http://127.0.0.1:8000" required>
    </div>

    <div class="form-group">
      <label for="apiKey">Your API Key</label>
      <input type="text" id="apiKey" placeholder="Paste key from Settings" required>
    </div>

    <button type="submit" class="btn">Save Credentials</button>
  </form>

  <div id="statusMsg" class="status-msg"></div>

  <div class="footer-link">
    <a href="#" id="openSettingsTab">Get key in SongChart Settings &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
