{% extends 'main/layout.html' %}
{% load static %}

{% block nav_analytics %}active{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'main/css/analytics.css' %}">
<div class="analytics-grid">

  <!-- 1. Top Tracks Distribution -->
  <section class="chart-card card-tracks">
    <h3 class="chart-title">Top Tracks Distribution</h3>
    <div class="chart-container">
      <canvas id="topTracksChart"></canvas>
    </div>
  </section>

  <!-- 2. Listening Activity by Hour -->
  <section class="chart-card card-hourly">
    <h3 class="chart-title">Listening Activity by Hour</h3>
    <div class="chart-container">
      <canvas id="hourlyHistChart"></canvas>
    </div>
  </section>

  <!-- 3. Top Artists by listening -->
  <section class="chart-card card-artists">
    <h3 class="chart-title">Top Artists by Listening</h3>
    <div class="chart-container artists-container">
      <canvas id="topArtistsChart"></canvas>
    </div>
  </section>

</div>
{% endblock %}

{% block scripts %}
<!-- Chart.js & Lucide -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>lucide.createIcons();</script>

<script src="{% static 'main/js/api.js' %}"></script>
<script src="{% static 'main/js/analytics.js' %}"></script>
{% endblock %}
