{% extends 'main/layout.html' %}
{% load static %}

{% block nav_analytics %}active{% endblock %}

{% block content %}
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 480px)); gap: 20px;">
  <section class="chart-card" style="background: #18181b; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); padding: 20px;">
    <h3 style="color: #fff; font-size: 1.1rem; margin-bottom: 16px; font-weight: 600;">Top Tracks Distribution</h3>
    <div style="position: relative; height: 260px;">
      <canvas id="topTracksChart"></canvas>
    </div>
  </section>
  <section class="chart-card" style="max-width: 600px; background: #18181b; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); padding: 20px;">
    <h3 style="color: #fff; font-size: 1.1rem; margin-bottom: 16px; font-weight: 600;">
    Listening Activity by Hour
    </h3>
    <div style="position: relative; height: 260px; width: 100%;">
      <canvas id="hourlyHistChart"></canvas>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<!-- Chart.js & Lucide -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>lucide.createIcons();</script>

<script src="{% static 'main/js/api.js' %}"></script>
<script src="{% static 'main/js/analytics.js' %}"></script>
{% endblock %}
