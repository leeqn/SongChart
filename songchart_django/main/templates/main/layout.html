{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <title>SongChart</title>
</head>
<body>
  <!-- Sidebar -->
  <aside>
    <div>
      <div class="logo">
        <div class="logo-icon">
          <i data-lucide="music-2" color="#fff" size="20"></i>
        </div>
        <span>SongChart</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item {% block nav_dashboard %}{% endblock %}"><a href="/#"><i data-lucide="layout-dashboard" size="18"></i> Dashboard</a></li>
        <li class="nav-item {% block nav_scrobbles %}{% endblock %}"><a href="/scrobble"><i data-lucide="disc" size="18"></i> Scrobble Log</a></li>
        <li class="nav-item {% block nav_analytics %}{% endblock %}"><a href="/analytics"><i data-lucide="bar-chart-2" size="18"></i> Analytics</a></li>
        <li class="nav-item {% block nav_settings %}{% endblock %}"><a href="/settings"><i data-lucide="settings" size="18"></i> Settings</a></li>
      </ul>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <div>
        <div style="font-size: 0.85rem; font-weight: 600;">Extension Active</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">SoundCloud Monitor</div>
      </div>
    </div>
  </aside>
  {% block content %}
    {% endblock %}
{% block scripts %}
  <!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<!-- Lucide Icons -->
<script>lucide.createIcons();</script>
{% endblock %}
</body>
</html>
