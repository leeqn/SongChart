<!-- main/templates/main/register.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — SongChart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'main/css/register_form.css' %}">
  <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon" style="background: #ff5500; border-radius: 8px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;">
        <i data-lucide="music-2" color="#fff" size="20"></i>
      </div>
      <h1 class="auth-title">Login</h1>
      <p class="auth-subtitle">Welcome back</p>
    </div>

{% if messages %}
    <ul class="form-errors">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

    <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Username</label>
      <input type="text" name="username" autofocus required id="id_username" class="auth-input" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label for="id_password">Password</label>
      <input type="password" name="password" required id="id_password" class="auth-input" placeholder="Enter password">
    </div>

        <button type="submit" class="btn-submit">Log In</button>
  </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register/">Register</a>
    </div>
  </div>
</div>

<script>
  if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
</body>
</html>
